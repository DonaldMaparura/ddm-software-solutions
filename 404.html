<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | DDM Software Solutions</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    .error-page h1 { font-size: 4rem; margin-bottom: 8px; color: var(--ink-faint); }
    .error-page h2 { margin-bottom: 16px; }
    .error-page p { color: var(--ink-muted); margin-bottom: 32px; }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <h1 aria-hidden="true">404</h1>
      <h2>Page not found</h2>
      <p>The page you are looking for does not exist or has been moved.</p>
      <a class="btn btn-primary" href="index.html">Return to homepage</a>
    </div>
  </div>
</body>
</html>
