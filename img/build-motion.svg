<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-labelledby="title desc">
  <title id="title">Animated build preview</title>
  <desc id="desc">Animated code and dashboard preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#203246"/>
    </linearGradient>
    <style>
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .slide { animation: slide 4s ease-in-out infinite; }
      .blink { animation: blink 1.2s steps(2) infinite; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes slide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(46px); } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: .2; } }
    </style>
  </defs>
  <rect width="700" height="440" fill="url(#bg)"/>
  <rect x="52" y="54" width="596" height="332" rx="22" fill="#111820" stroke="#456276"/>
  <circle cx="92" cy="92" r="8" fill="#ef6b62"/>
  <circle cx="120" cy="92" r="8" fill="#f5c46b"/>
  <circle cx="148" cy="92" r="8" fill="#79c7aa"/>
  <rect x="86" y="140" width="180" height="12" rx="6" fill="#8bc8ff" class="pulse"/>
  <rect x="86" y="176" width="320" height="12" rx="6" fill="#fffdf8" opacity=".44"/>
  <rect x="86" y="212" width="240" height="12" rx="6" fill="#fffdf8" opacity=".34"/>
  <rect x="86" y="248" width="370" height="12" rx="6" fill="#fffdf8" opacity=".24"/>
  <rect x="86" y="284" width="210" height="12" rx="6" fill="#79c7aa" class="slide"/>
  <rect x="480" y="142" width="110" height="110" rx="16" fill="#1769aa" opacity=".82"/>
  <path d="M506 224l32-45 26 28 18-52" fill="none" stroke="#fffdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
  <rect x="480" y="284" width="114" height="14" rx="7" fill="#f5c46b"/>
  <rect x="480" y="316" width="84" height="14" rx="7" fill="#79c7aa"/>
  <rect x="86" y="326" width="10" height="18" rx="3" fill="#8bc8ff" class="blink"/>
</svg>
